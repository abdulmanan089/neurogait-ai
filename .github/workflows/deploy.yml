# Build NeuroGait AI and deploy the static output to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          # Serve assets relative to the repo subpath (e.g. /gait-voice-ai/).
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Select static output
        run: |
          if [ -d dist/client ]; then cp -r dist/client site;
          elif [ -d .output/public ]; then cp -r .output/public site;
          elif [ -d dist ]; then cp -r dist site;
          else echo "No static build output found" && exit 1; fi
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
